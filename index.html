<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NALTP OD Caps</title>
<style>
  body { font-family: sans-serif; margin: 0 auto; padding: 16px; max-width: 760px; line-height: 1.4; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  details { margin-bottom: 12px; color: #444; }
  #filter-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  #filter-bar select { font-size: 15px; padding: 6px; }
  .cap-card { display: block; position: relative; border: 1px solid #ccc; border-radius: 8px; padding: 10px 12px; margin-bottom: 10px;
    color: inherit; text-decoration: none; }
    .cap-teams { font-weight: bold; }
  .cap-details { color: #555; font-size: 14px; }
  .cap-links { float: right; text-align: right; }
  .cap-links a { display: inline-block; margin: 0 0 6px 8px; text-decoration: none; }
  .cap-tagpro { border: 1px solid #2e7d32; color: #2e7d32; border-radius: 6px; padding: 7px 12px; }
  .cap-watch { background: #2e7d32; color: #fff; border-radius: 6px; padding: 8px 14px; margin-left: 8px; }
</style>
</head>
<body>
<h1>NALTP caps against OD</h1>
<details id="rules-box"><summary>How these were picked</summary><p id="rules-text">Loading...</p>
  <p><a href="data/od_caps.csv">Every cap that passes the rules (CSV)</a></p></details>
<div id="filter-bar">
  <select id="defence-filter"><option value="">Any defence</option></select>
  <select id="season-filter"><option value="">Any season</option></select>
  <select id="league-filter"><option value="">Any league</option></select>
</div>
<div id="caps-list"></div>
<script>
  const LEAD_MS = 2000; // the viewer starts this long before the grab
  const clock = s => { s = Math.max(0, Math.floor(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  const filters = { kind: 'defence-filter', season: 'season-filter', league: 'league-filter' };
  let caps = [];

  function fillFilter(field) {
    const select = document.getElementById(filters[field]);
    for (const v of [...new Set(caps.map(c => c[field]))].sort()) select.add(new Option(v, v));
    select.addEventListener('change', show);
  }

  function show() {
    const list = document.getElementById('caps-list');
    list.textContent = '';
    const shown = caps.filter(c => Object.entries(filters).every(([f, id]) => {
      const v = document.getElementById(id).value;
      return !v || c[f] === v;
    }));
    for (const c of shown) {
      const title = `${c.carrier}: grab to cap, ${c.kind} - ${c.season} ${c.league} week ${c.week} ${c.game}, ${c.map}`;
      const a = document.createElement('div');
      a.className = 'cap-card';
      const watch = document.createElement('a');
      watch.className = 'cap-watch';
      watch.textContent = 'Watch';
      watch.href = `viewer/?replay=${c.key}&t=${Math.max(0, c.grab_ms - LEAD_MS)}&follow=${c.carrier_id}&title=${encodeURIComponent(title)}` + (c.tagpro_url ? `&tagpro=${encodeURIComponent(c.tagpro_url)}` : '');
      const links = document.createElement('div');
      links.className = 'cap-links';
      links.appendChild(watch);
      if (c.tagpro_url) {
        const tp = document.createElement('a');
        tp.className = 'cap-tagpro';
        tp.href = c.tagpro_url;
        tp.target = '_blank';
        tp.rel = 'noopener';
        tp.textContent = 'On TagPro';
        links.appendChild(tp);
      }
      const teams = document.createElement('div');
      teams.className = 'cap-teams';
      teams.textContent = `${c.team_a} vs ${c.team_b}`;
      const line1 = document.createElement('div');
      line1.textContent = `${c.carrier} (${c.cap_team}) grabs and caps (${c.kind}) in ${Number(c.run_s).toFixed(1)} s`;
      const line2 = document.createElement('div');
      line2.className = 'cap-details';
      line2.textContent = `${c.season} ${c.league}, week ${c.week} ${c.game} · ${c.map} · grab ${clock(c.grab_clock_s)} into the game · turning ${c.turn_deg_per_s}°/s · ${c.jukes} jukes`;
      a.append(links, teams, line1, line2);
      list.appendChild(a);
    }
    if (!shown.length) list.textContent = 'No caps match.';
  }

  fetch('caps.json', { cache: 'no-store' }).then(r => r.json()).then(data => {
    const rules = data.rules;
    caps = data.caps;
    document.getElementById('rules-text').textContent =
      `Each one is a flag carrier's run from their grab to their cap, for following the path. ${caps.length} runs picked at ` +
      `random (seed ${rules.seed}) from the ${rules.runs_passing} that pass these rules, out of ${rules.runs_found} runs ` +
      `against OD or chased in ${rules.games_read} comp replays. The run lasts ${rules.min_run_s} to ${rules.max_run_s} seconds and the ` +
      `carrier holds the flag the whole time. It is against OD, or the carrier is chased and boosts away, or both. ` +
      `OD: ${rules.od_check_s} seconds before the cap (or at the grab, if later), 3 or 4 enemies are alive within ` +
      `${rules.od_radius_tiles} tiles of the carrier's flag, or 2 are and the other 2 are dead. Chased: an enemy is right ` +
      `behind the carrier (about half a tile between them) and the carrier uses a boost within ${rules.escape_s} seconds. ` +
      `Nobody who was chasing the carrier gets ahead of them, and the carrier never goes more than ` +
      `${rules.max_backtrack_tiles} tiles backwards (away from their flag). Turning (how much the carrier's direction changes, in degrees a second) is between the ${rules.turn_low_pct}th and ` +
      `${rules.turn_high_pct}th percentile of runs of that length (${rules.turn_min} to ${rules.turn_max}): no plain ` +
      `straight lines, nothing too zig-zaggy to follow. A juke is a full left/right or up/down reversal. ` +
      `Watch opens the replay ${LEAD_MS / 1000} seconds before the grab, showing the whole map.`;
    Object.keys(filters).forEach(fillFilter);
    show();
  });
</script>
</body>
</html>
