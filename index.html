<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NALTP OD Caps</title>
<style>
  body { font-family: sans-serif; margin: 0 auto; padding: 16px; max-width: 760px; line-height: 1.4; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  details { margin-bottom: 12px; color: #444; }
  #filter-bar { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  #filter-bar select { font-size: 15px; padding: 6px; }
  .cap-card { display: block; border: 1px solid #ccc; border-radius: 8px; padding: 10px 12px; margin-bottom: 10px;
    color: inherit; text-decoration: none; }
  .cap-card:hover { border-color: #2e7d32; }
  .cap-teams { font-weight: bold; }
  .cap-details { color: #555; font-size: 14px; }
  .cap-watch { float: right; background: #2e7d32; color: #fff; border-radius: 6px; padding: 8px 14px; margin-left: 8px; }
</style>
</head>
<body>
<h1>NALTP caps against OD</h1>
<details id="rules-box"><summary>How these were picked</summary><p id="rules-text">Loading...</p>
  <p><a href="data/od_caps.csv">Every cap that passes the rules (CSV)</a></p></details>
<div id="filter-bar">
  <select id="defence-filter"><option value="">Any defence</option></select>
  <select id="season-filter"><option value="">Any season</option></select>
  <select id="league-filter"><option value="">Any league</option></select>
</div>
<div id="caps-list"></div>
<script>
  const LEAD_MS = 10000; // the viewer starts this long before the cap
  const clock = s => { s = Math.max(0, Math.floor(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  const filters = { kind: 'defence-filter', season: 'season-filter', league: 'league-filter' };
  let caps = [];

  function fillFilter(field) {
    const select = document.getElementById(filters[field]);
    for (const v of [...new Set(caps.map(c => c[field]))].sort()) select.add(new Option(v, v));
    select.addEventListener('change', show);
  }

  function show() {
    const list = document.getElementById('caps-list');
    list.textContent = '';
    const shown = caps.filter(c => Object.entries(filters).every(([f, id]) => {
      const v = document.getElementById(id).value;
      return !v || c[f] === v;
    }));
    for (const c of shown) {
      const title = `${c.carrier} caps vs ${c.kind} - ${c.season} ${c.league} week ${c.week} ${c.game}, ${c.map}`;
      const a = document.createElement('a');
      a.className = 'cap-card';
      a.href = `viewer/?replay=${c.key}&t=${Math.max(0, c.cap_ms - LEAD_MS)}&follow=${c.carrier_id}&title=${encodeURIComponent(title)}`;
      const watch = document.createElement('span');
      watch.className = 'cap-watch';
      watch.textContent = 'Watch';
      const teams = document.createElement('div');
      teams.className = 'cap-teams';
      teams.textContent = `${c.team_a} vs ${c.team_b}`;
      const line1 = document.createElement('div');
      line1.textContent = `${c.carrier} (${c.cap_team}) caps against ${c.kind}`;
      const line2 = document.createElement('div');
      line2.className = 'cap-details';
      line2.textContent = `${c.season} ${c.league}, week ${c.week} ${c.game} · ${c.map} · ${clock(c.game_clock_s)} into the game · zig-zag ${c.zigzag}`;
      a.append(watch, teams, line1, line2);
      list.appendChild(a);
    }
    if (!shown.length) list.textContent = 'No caps match.';
  }

  fetch('caps.json').then(r => r.json()).then(data => {
    const rules = data.rules;
    caps = data.caps;
    document.getElementById('rules-text').textContent =
      `${caps.length} caps picked at random (seed ${rules.seed}) from the ${rules.caps_passing} caps in ${rules.games_read} ` +
      `comp replays that pass these rules, checked ${rules.window_s} seconds before the cap: the carrier already has the flag; ` +
      `3 or 4 enemies are alive within ${rules.od_radius_tiles} tiles of the carrier's flag, or 2 are and the other 2 are dead; ` +
      `and the carrier's path into the flag is at least ${rules.min_zigzag} times the straight-line distance (no straight lines). ` +
      `"Zig-zag" is that ratio. Watch opens the replay ${LEAD_MS / 1000} seconds before the cap.`;
    Object.keys(filters).forEach(fillFilter);
    show();
  });
</script>
</body>
</html>
